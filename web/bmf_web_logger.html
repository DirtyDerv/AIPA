<!DOCTYPE html>
<html>
<head>
    <title>BMF Work Logger</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .container { background: #f5f5f5; padding: 30px; border-radius: 10px; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #007bff; color: white; padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .success { background: #d4edda; color: #155724; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .warning { background: #fff3cd; color: #856404; padding: 10px; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 BMF Work Logger</h1>
        <p>Log your BMF work entries here:</p>
        
        <div class="warning">
            <strong>⚠️ Setup Required:</strong> Update webhook URL in this file with your actual Discord webhook from config/CREDENTIALS.md
        </div>
        
        <form id="bmfForm">
            <input type="text" id="workEntry" placeholder="Enter your work description..." required>
            <button type="submit">Log BMF Work Entry</button>
        </form>
        
        <div id="result"></div>
    </div>
    
    <script>
        document.getElementById('bmfForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const workEntry = document.getElementById('workEntry').value;
            const resultDiv = document.getElementById('result');
            
            // Replace with your actual Discord webhook URL from config/CREDENTIALS.md
            const webhookUrl = 'YOUR_DISCORD_WEBHOOK_URL_HERE';
            
            if (webhookUrl === 'YOUR_DISCORD_WEBHOOK_URL_HERE') {
                resultDiv.innerHTML = '<div class="warning"><strong>Configuration Needed:</strong> Please update the webhook URL in this file with your actual Discord webhook.</div>';
                return;
            }
            
            // Send to Discord webhook
            const discordData = {
                embeds: [{
                    title: "✅ BMF Work Logged (Web Interface)",
                    description: workEntry,
                    color: 16753920,
                    fields: [
                        {name: "User", value: "woody", inline: true},
                        {name: "Time", value: new Date().toLocaleString(), inline: true},
                        {name: "Source", value: "Web Interface", inline: true}
                    ]
                }]
            };
            
            fetch(webhookUrl, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(discordData)
            })
            .then(response => {
                if (response.ok) {
                    resultDiv.innerHTML = '<div class="success"><strong>Success!</strong> BMF work entry logged: ' + workEntry + '</div>';
                    document.getElementById('workEntry').value = '';
                } else {
                    throw new Error('Failed to send');
                }
            })
            .catch(error => {
                resultDiv.innerHTML = '<div class="warning"><strong>Error:</strong> Failed to log work entry. Check console for details.</div>';
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
